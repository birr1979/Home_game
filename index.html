<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Pocket Town</title>
  <meta name="description" content="A pretend-play sandbox: drag the friends around their house, kitchen and garden, feed them, dress them up and tuck them into bed.">
  <meta name="theme-color" content="#7b5cff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pocket Town">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage"><div id="world"></div></div>

  <div id="ui">
    <button class="btn arrow" id="prev" aria-label="Previous room">&#8249;</button>
    <button class="btn arrow" id="next" aria-label="Next room">&#8250;</button>
    <nav id="dots" aria-label="Rooms">
      <button class="btn dot" data-room="0" aria-label="Bedroom">🛏️</button>
      <button class="btn dot" data-room="1" aria-label="Kitchen">🍳</button>
      <button class="btn dot" data-room="2" aria-label="Garden">🌳</button>
    </nav>
    <div id="tools">
      <button class="btn small" id="install" hidden aria-label="Install app">⬇️</button>
      <button class="btn small" id="help" aria-label="How to play">?</button>
      <button class="btn small" id="music" aria-label="Music on or off" aria-pressed="true">🎵</button>
      <button class="btn small" id="mute" aria-label="Sound on or off">🔊</button>
      <button class="btn small" id="reset" aria-label="Start over">↺</button>
    </div>
  </div>

  <section id="intro" class="screen" aria-label="Pocket Town">
    <div class="intro-inner">
      <div class="intro-friends" id="introFriends" aria-hidden="true"></div>
      <h1 class="logo">Pocket <span>Town</span></h1>
      <button class="big-btn play" id="playBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>
        Play
      </button>
      <button class="big-btn how" id="howBtn">How to play</button>
    </div>
  </section>

  <section id="howto" class="screen" role="dialog" aria-modal="true" aria-labelledby="stepTitle" hidden>
    <div class="card">
      <button class="close" id="howClose" aria-label="Close">✕</button>
      <div class="step-art" id="stepArt" aria-hidden="true"></div>
      <p class="step-count" id="stepCount"></p>
      <h2 id="stepTitle"></h2>
      <p class="step-text" id="stepText"></p>
      <div class="step-nav">
        <button class="nav-btn" id="stepPrev">Back</button>
        <div class="step-dots" id="stepDots"></div>
        <button class="nav-btn primary" id="stepNext">Next</button>
      </div>
    </div>
  </section>

  <div id="rotate" hidden>Turn your device sideways for a bigger town ↻</div>

  <script src="game.js"></script>
</body>
</html>
